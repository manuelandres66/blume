<!DOCTYPE html>
<html lang="es">
    {% include 'barra.html' %}
    <head>
        <title>Blume Diseño | Productos de oro o plata</title>
        <script src="https://kit.fontawesome.com/7c5129238c.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
        <meta name="description" content="¿Oro o plata? Encuentra en esta página todo lo que nececitas sobre nuestros productos. ">
        <style>
            body {
                background-color: #000;
                overflow: hidden;
            }
    
            .container {
                width: 100%;
                height: 45vh;
                position: relative;
            }
    
            .container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: 2;
                opacity: .7;
            }
    
            .titulo {
                opacity: 1;
                font-family: 'Sora', sans-serif;
                font-size: 80px;
                text-align: center;
                font-weight: 300;
                z-index: 5;
                color: #fff;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                transition: font-size 1s;
            }
    
            .titulo:hover {
                font-size: 100px;
            }
    
            h2 {
                color: #fff;
            }
    
            @media only screen and (max-width: 781px) {
                .titulo {
                    font-size: 30px;
                }
    
                .titulo:hover {
                    font-size: 50px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="/static/images/oro_fondo.jpg" alt="oro">
            <a href="/joya/oro">
                <h1 class="titulo" id="oro_titulo">Productos de oro</h1>
            </a>
        </div>
        <div class="container">
            <img src="/static/images/plata_fondo.jpg" alt="plata">
            <a href="/joya/plata">
                <h2 class="titulo" id="plata_titulo">Productos de plata</h2>
            </a>
        </div>
    </body>
    
</html>
